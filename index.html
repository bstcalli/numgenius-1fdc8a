<!doctype html>
<html lang="ko">
<head>
<title>숫자 천재</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f56e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="숫자 천재">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#f5f3ec; --card:#ffffff; --ink:#1c1a15; --sub:#6d685d; --line:#e3ded1;
  --accent:#2f56e0; --accent-ink:#ffffff; --soft:#e9eeff;
  --good:#18925a; --good-soft:#e2f6ea; --bad:#d23f3f; --bad-soft:#fde8e8;
  --gold:#e19b0c; --lock:#b9b3a5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13151a; --card:#1c1f26; --ink:#ecebe6; --sub:#9a9fab; --line:#2b2f39;
    --accent:#7090ff; --accent-ink:#0b0f1f; --soft:#222a44;
    --good:#3fcf80; --good-soft:#163222; --bad:#ff6d6d; --bad-soft:#3a1c1e;
    --gold:#f6c24c; --lock:#4a4f5c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#13151a; --card:#1c1f26; --ink:#ecebe6; --sub:#9a9fab; --line:#2b2f39;
    --accent:#7090ff; --accent-ink:#0b0f1f; --soft:#222a44;
    --good:#3fcf80; --good-soft:#163222; --bad:#ff6d6d; --bad-soft:#3a1c1e;
    --gold:#f6c24c; --lock:#4a4f5c;
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 14px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo span{color:var(--accent)}
.chips{display:flex;gap:6px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:22px 4px 10px;color:var(--sub);font-weight:700;letter-spacing:-.01em}
h3{margin:0 0 6px;font-size:18px;letter-spacing:-.02em}
.muted{color:var(--sub);font-size:14px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;
  background:var(--accent);color:var(--accent-ink);transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:10px 12px;font-size:14px;border-radius:12px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--sub)}
.next-label{font-size:13px;color:var(--sub);margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;transition:transform .12s ease}
.tile:active{transform:scale(.96)}
.tile b{display:block;font-size:20px}
.tile .st{font-size:13px;color:var(--gold);letter-spacing:1px}
.tile.locked{opacity:.55}
.tile.locked .st{color:var(--lock)}
.tile.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:8px}
.item .ico{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-size:15px}
.item .txt span{font-size:13px;color:var(--sub)}
.item .st{color:var(--gold);font-size:13px;white-space:nowrap}
.item.locked{opacity:.5}
.item.now{border-color:var(--accent)}
.tip{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.step{border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:13px;color:var(--sub)}
.step.done{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.table{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.fact{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);font-size:17px;font-weight:600}
.fact .ans{min-width:44px;text-align:right;color:var(--accent);font-weight:800}
.fact .ans.hid{color:transparent;background:var(--line);border-radius:6px}
.fact.known{opacity:.55;font-weight:500}
.fact small{display:block;font-size:11px;color:var(--sub);font-weight:500}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qhead .bar{flex:1}
.qtitle{font-size:14px;color:var(--sub);text-align:center;margin:6px 0 0}
.qbox{text-align:center;padding:26px 8px 18px}
.q{font-size:clamp(40px,13vw,64px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ansline{margin:14px auto 0;min-height:64px;width:min(220px,80%);border-bottom:3px solid var(--line);font-size:44px;font-weight:800;color:var(--accent);
  display:flex;align-items:flex-end;justify-content:center}
.fb{min-height:52px;margin-top:10px;font-size:16px;font-weight:700}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.hintbtn{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:14px;padding:4px}
.flash-good{animation:fg .35s ease}
.flash-bad{animation:fb .4s ease}
@keyframes fg{0%{background:var(--good-soft)}100%{background:var(--card)}}
@keyframes fb{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 0;font-size:24px;font-weight:700;transition:transform .08s ease,background .08s}
.pad button:active{transform:scale(.95);background:var(--soft)}
.pad .fn{font-size:16px;color:var(--sub)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;min-width:46px;text-align:right}
/* result */
.big-stars{font-size:44px;color:var(--gold);letter-spacing:6px;text-align:center}
.score{text-align:center;font-size:40px;font-weight:800;margin:4px 0}
.mist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mist span{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:4px 8px;font-size:14px;font-weight:600}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px;font-size:12px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.saved{text-align:center;font-size:12px;color:var(--sub);margin-top:18px}
.trick-ex{font-size:20px;font-weight:700;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:12px;margin:10px 0}
ol.steps-ol{padding-left:20px;margin:8px 0}
.lvbar{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:6px}
.lvbar i{height:6px;border-radius:3px;background:var(--line)}
.lvbar i.on{background:var(--accent)}
.lvrow{display:flex;align-items:center;gap:12px;margin-top:14px}
.lvrow>div{flex:1;min-width:0;text-align:center}
.lvrow b{font-size:22px}
.item .lvchip{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.favbtn{background:none;border:0;font-size:20px;line-height:1;color:var(--lock);padding:2px 6px;margin-left:auto}
.favbtn.on{color:var(--gold)}
.fact .ans{margin-left:4px}
.favlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.favchip{border:1px solid var(--gold);background:transparent;border-radius:10px;padding:6px 10px;font-size:15px;font-weight:600}
.favchip span{color:var(--sub);margin-left:4px;font-size:12px}
.pkrow{display:grid;grid-template-columns:32px repeat(9,minmax(0,1fr));gap:4px;align-items:center;margin-bottom:4px}
.pkrow span{font-size:12px;color:var(--sub);font-weight:700}
.pk{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-size:14px;font-weight:700;min-width:0}
.pk.on{background:var(--gold);border-color:var(--gold);color:var(--accent-ink)}
.mist button{border:0;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:4px 8px;font-size:14px;font-weight:600}
.mist button.on{background:var(--gold);color:var(--accent-ink)}
.flashcard{display:block;width:100%;color:inherit;font:inherit}
.pop{animation:pop .18s ease}
@keyframes pop{from{transform:scale(.8);opacity:.2}}
ol.steps-ol li{margin:4px 0}
@media (max-width:360px){
  .grid{gap:6px} .tile b{font-size:18px} .pad button{padding:13px 0}
  .chip{padding:3px 8px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const KEY='numgenius.v1';
const DANS=[2,3,4,5,6,7,8,9];
const TIPS={
  2:'2씩 커져요. 답은 모두 짝수예요: 2, 4, 6, 8, 10…',
  3:'3씩 커져요. 3·6·9 / 12·15·18 / 21·24·27 — 세 개씩 끊어서 노래처럼 외워 보세요.',
  4:'4단은 2단의 두 배예요. 2×3=6 이면 4×3=12.',
  5:'끝자리가 5, 0, 5, 0 번갈아 나와요. 시계 분침(5분, 10분, 15분…)과 똑같아요.',
  6:'짝수를 곱하면 끝자리가 그 수와 같아요: 6×2=1<b>2</b>, 6×4=2<b>4</b>, 6×6=3<b>6</b>, 6×8=4<b>8</b>.',
  7:'제일 어려운 단이지만 7×2~7×6은 앞 단에서 이미 배웠어요. 새로 외울 건 49, 56, 63 세 개뿐! 56=7×8 은 "5, 6, 7, 8" 순서로 외우세요.',
  8:'끝자리가 8, 6, 4, 2, 0 으로 2씩 내려가며 반복돼요. 4단의 두 배이기도 해요.',
  9:'십의 자리는 하나씩 커지고, 일의 자리는 하나씩 작아져요(09, 18, 27…). 두 숫자를 더하면 항상 9! 9×7 → 십의 자리는 7보다 1 작은 6, 일의 자리는 9-6=3 → 63.'
};
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fkey=(a,b)=>a<=b?`${a}x${b}`:`${b}x${a}`;
const fmtDay=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmtDay(new Date());
const yesterday=()=>fmtDay(new Date(Date.now()-864e5));
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);

/* 암산 비법 */
const TRICKS=[
  {id:'x5',name:'× 5 비법',sub:'반으로 나누고 0 붙이기',
   explain:`<ol class="steps-ol"><li>5는 10의 절반이에요.</li><li>그래서 <b>× 5 = 반으로 나누고 × 10</b> 이에요.</li><li>짝수라면: 반으로 나눈 뒤 뒤에 0을 붙이면 끝!</li></ol>`,
   ex:'48 × 5 → 48의 반 24 → <b>240</b>',hint:'반으로 나누고 0 붙이기',
   gen:()=>{const a=rand(6,49)*2;return{q:`${a} × 5`,a:a*5};}},
  {id:'teen',name:'십몇 × 한 자리',sub:'10 묶음 + 나머지',
   explain:`<ol class="steps-ol"><li>13 × 7 은 (10 × 7) + (3 × 7) 로 나눠요.</li><li>70 + 21 = 91</li><li>구구단만 알면 19단까지 할 수 있어요.</li></ol>`,
   ex:'16 × 8 → 80 + 48 → <b>128</b>',hint:'10 × 한자리 + 나머지 × 한자리',
   gen:()=>{const a=rand(11,19),b=rand(2,9);return{q:`${a} × ${b}`,a:a*b};}},
  {id:'x11',name:'× 11 비법',sub:'양 끝은 그대로, 가운데에 합',
   explain:`<ol class="steps-ol"><li>두 자리 수를 벌려요: 3_6</li><li>가운데에 두 숫자의 합(3+6=9)을 넣어요 → 396</li><li>합이 10을 넘으면 앞자리에 1을 올려요: 78×11 → 7(15)8 → 858</li></ol>`,
   ex:'36 × 11 → 3 (3+6) 6 → <b>396</b>',hint:'양 끝 그대로, 가운데에 두 숫자의 합',
   gen:()=>{const a=rand(12,99);return{q:`${a} × 11`,a:a*11};}},
  {id:'x9',name:'× 9 비법',sub:'× 10 하고 한 번 빼기',
   explain:`<ol class="steps-ol"><li>9는 10보다 1 작아요.</li><li>그래서 <b>× 9 = × 10 − 그 수</b></li><li>23 × 9 → 230 − 23 = 207</li></ol>`,
   ex:'47 × 9 → 470 − 47 → <b>423</b>',hint:'× 10 한 다음 그 수를 빼기',
   gen:()=>{const a=rand(12,99);return{q:`${a} × 9`,a:a*9};}},
  {id:'sq5',name:'끝이 5인 수 제곱',sub:'앞자리 × (앞자리+1), 뒤에 25',
   explain:`<ol class="steps-ol"><li>35 × 35 에서 앞자리 3을 봐요.</li><li>3 × 4(하나 큰 수) = 12</li><li>뒤에 25를 붙여요 → 1225</li></ol>`,
   ex:'65 × 65 → 6×7=42, 25 → <b>4225</b>',hint:'앞자리 × (앞자리+1), 뒤에 25',
   gen:()=>{const t=rand(1,9)*10+5;return{q:`${t} × ${t}`,a:t*t};}},
  {id:'sum10',name:'일의 자리 합이 10',sub:'23 × 27 같은 짝꿍 곱셈',
   explain:`<ol class="steps-ol"><li>십의 자리가 같고, 일의 자리 합이 10인 경우예요 (23 × 27).</li><li>앞: 십의 자리 × (십의 자리+1) → 2 × 3 = 6</li><li>뒤: 일의 자리끼리 곱해 두 자리로 → 3 × 7 = 21</li><li>붙이면 621 (뒤가 한 자리면 0을 채워요: 41×49 → 20, 09 → 2009)</li></ol>`,
   ex:'84 × 86 → 8×9=72, 4×6=24 → <b>7224</b>',hint:'앞: 십의자리×(+1) / 뒤: 일의자리끼리 곱(두 자리)',
   gen:()=>{const t=rand(1,9),u=rand(1,9);return{q:`${t}${u} × ${t}${10-u}`,a:(t*10+u)*(t*10+10-u)};}}
];

/* 암산 훈련장: 종목마다 Lv.1~10, 잘하면 레벨 업 */
const nd=d=>rand(10**(d-1),10**d-1);
const ADD=[[1,1],[2,1],[2,2],[2,2],[3,2],[3,3],[2,2,2],[3,3,2],[4,3],[4,4]];
const MUL=[[2,9,2,9],[1,9,2,9],[11,19,2,9],[21,99,2,9],[101,299,2,9],[300,999,2,9],[11,19,11,19],[21,49,11,19],[21,99,11,29],[21,99,21,99]];
const DIV=[[2,5,2,9],[2,9,2,9],[2,9,10,19],[2,9,10,30],[2,9,10,99],[2,9,100,199],[11,19,2,9],[11,19,10,30],[2,9,100,999],[11,99,11,50]];
const FL=[[3,1,1200],[4,1,1100],[5,1,1000],[3,2,1100],[4,2,1000],[5,2,900],[6,2,800],[4,3,1000],[5,3,900],[7,2,650]];
const DRILLS=[
  {id:'make10',name:'짝꿍 수 찾기',sub:'10 · 100 · 1000을 만드는 수',hint:'100 짝꿍: 십의 자리는 합 9, 일의 자리는 합 10',
   tip:'모든 암산의 기본기예요. 7의 짝꿍은 3(합 10), 64의 짝꿍은 36(합 100). 100의 짝꿍은 "십의 자리는 합 9, 일의 자리는 합 10"으로 찾아요: 64 → 6의 짝 3, 4의 짝 6 → 36.',
   gen:lv=>{if(lv<=3){const a=rand(1,9);return{q:`${a} + ? = 10`,a:10-a};}
     if(lv<=7){const a=rand(11,99);return{q:`${a} + ? = 100`,a:100-a};}
     const a=rand(101,999);return{q:`${a} + ? = 1000`,a:1000-a};}},
  {id:'add',name:'덧셈 암산',sub:'큰 자리부터 더하기',hint:'큰 자리끼리 먼저, 그다음 작은 자리',
   tip:'왼쪽(큰 자리)부터 더해요. 47 + 38 → 40 + 30 = 70, 7 + 8 = 15 → 70 + 15 = 85. 세 수를 더할 땐 합이 10이 되는 짝꿍끼리 먼저 묶어요.',
   gen:lv=>{const ds=ADD[lv-1];let ns;
     do{ns=ds.map(nd);}while((lv===3&&ns[0]%10+ns[1]%10>=10)||(lv===4&&ns[0]%10+ns[1]%10<10));
     return{q:ns.join(' + '),a:ns.reduce((x,y)=>x+y,0)};}},
  {id:'sub',name:'뺄셈 암산',sub:'넉넉하게 빼고 되돌리기',hint:'28은 30으로 빼고 2를 다시 더하기',
   tip:'딱 떨어지는 수로 넉넉하게 빼고, 더 뺀 만큼 되돌려요. 63 − 28 → 63 − 30 = 33, 2를 더 뺐으니 + 2 → 35. 100 − 수, 1000 − 수는 짝꿍 수로 바로 답해요.',
   gen:lv=>{let a,b;switch(lv){
     case 1:a=rand(11,18);b=rand(a-9,9);break;
     case 2:a=nd(2);b=rand(2,9);break;
     case 3:do{a=nd(2);b=nd(2);}while(b>=a||b%10>a%10);break;
     case 4:do{a=nd(2);b=nd(2);}while(b>=a||b%10<=a%10);break;
     case 5:a=100;b=nd(2);break;
     case 6:a=nd(3);b=nd(2);break;
     case 7:do{a=nd(3);b=nd(3);}while(b>=a);break;
     case 8:a=1000;b=nd(3);break;
     case 9:a=nd(4);b=nd(3);break;
     default:do{a=nd(4);b=nd(4);}while(b>=a);}
     return{q:`${a} − ${b}`,a:a-b};}},
  {id:'mul',name:'곱셈 암산',sub:'쪼개서 곱하기',hint:'큰 자리와 작은 자리로 쪼개서 곱한 뒤 더하기',
   tip:'수를 쪼개서 곱해요. 24 × 6 → 20 × 6 = 120, 4 × 6 = 24 → 144. 두 자리끼리는 23 × 14 → 23 × 10 = 230, 23 × 4 = 92 → 322.',

   tip:'구구단을 거꾸로 써요. 56 ÷ 7 → 7 × ? = 56 → 8. 큰 수는 쪼개요: 84 ÷ 4 → 80 ÷ 4 = 20, 4 ÷ 4 = 1 → 21.',
   gen:lv=>{const[d1,d2,q1,q2]=DIV[lv-1];const d=rand(d1,d2),q=rand(q1,q2);return{q:`${q*d} ÷ ${d}`,a:q};}},
  {id:'mix',name:'섞어 암산',sub:'+ − × ÷ 무작위',hint:'',

   about:lv=>{const[c,dg,ms]=FL[lv-1];return`${dg}자리 숫자 ${c}개 · ${(ms/1000).toFixed(1)}초 간격`;},
   gen:lv=>{const[c,dg,ms]=FL[lv-1];const ns=Array.from({length:c},()=>nd(dg));return{q:ns.join(' + '),a:ns.reduce((x,y)=>x+y,0),flash:ns,ms};}}
];

/* ---------- 저장 ---------- */
function defState(){
  const d={};DANS.forEach(n=>d[n]={learned:false,practiced:false,stars:0,best:null});
  return{v:1,dans:d,facts:{},tricks:{},drills:{},favs:[],mix:{stars:0,best:null},speed:{best:0},total:0,correct:0,streak:0,lastDay:null,sound:true,savedAt:null};
}
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')a[k]=merge(a[k],b[k]);else a[k]=b[k];}return a;}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)return merge(defState(),JSON.parse(raw));}catch(e){}return defState();}
function save(){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}cloudPush();}
/* 계정 저장 (claude.ai 계정에 나만 보이게 저장 → 폰·PC 어디서나 이어하기) */
let cloudRef=null,cloudBusy=false,cloudDirty=false,cloudTimer=null,cloudOk=false;
function cloudPush(){if(!cloudRef)return;cloudDirty=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudFlush,800);}
async function cloudFlush(){
  if(!cloudRef||cloudBusy||!cloudDirty)return;cloudBusy=true;cloudDirty=false;
  try{await cloudRef.set({json:JSON.stringify(S),savedAt:S.savedAt});cloudOk=true;}catch(e){cloudOk=false;}
  cloudBusy=false;if(cloudDirty)cloudFlush();
}
async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/numgenius/progress');
    const snap=await ref.get();
    if(snap.exists){const d=snap.data();
      if(d&&d.json&&(d.savedAt||0)>(S.savedAt||0)){S=merge(defState(),JSON.parse(d.json));try{localStorage.setItem(KEY,d.json);}catch(e){}
        if(!Q)home();}}
    cloudRef=ref;cloudOk=true;
    if(!snap.exists||(snap.data()?.savedAt||0)<(S.savedAt||0)){cloudDirty=true;cloudFlush();}
    if(!Q)home();
  }catch(e){}
}
let S=load();

function touchDay(){
  const t=today();if(S.lastDay===t)return;
  S.streak=(S.lastDay===yesterday())?S.streak+1:1;S.lastDay=t;
}
const curStreak=()=>(S.lastDay===today()||S.lastDay===yesterday())?S.streak:0;

/* ---------- 즐겨찾기 (못 외운 구구단) ---------- */
const favHas=(a,b)=>S.favs.includes(`${a}x${b}`)||S.favs.includes(`${b}x${a}`);
function favToggle(a,b,quiet){
  if(favHas(a,b)){S.favs=S.favs.filter(k=>k!==`${a}x${b}`&&k!==`${b}x${a}`);if(!quiet)toast(`${a} × ${b} 즐겨찾기에서 뺐어요`);}
  else{S.favs.push(`${a}x${b}`);if(!quiet)toast(`★ ${a} × ${b} 즐겨찾기에 넣었어요`);}
  save();
}
const favPairs=()=>S.favs.map(k=>k.split('x').map(Number));

/* ---------- 진도 ---------- */
const danOpen=n=>n===2||S.dans[n-1].stars>0;
const mixOpen=()=>S.dans[9].stars>0;
const trickOpen=i=>S.mix.stars>0&&(i===0||(S.tricks[TRICKS[i-1].id]?.stars||0)>0);
const trickStars=id=>S.tricks[id]?.stars||0;
function progress(){
  let done=0,all=0;
  DANS.forEach(n=>{const d=S.dans[n];all+=3;done+=(d.learned?1:0)+(d.practiced?1:0)+(d.stars>0?1:0);});
  all+=1;done+=S.mix.stars>0?1:0;
  TRICKS.forEach(t=>{all++;done+=trickStars(t.id)>0?1:0;});
  return Math.round(done/all*100);
}
function nextStep(){
  for(const n of DANS){const d=S.dans[n];if(d.stars===0){
    if(!d.learned)return{label:`${n}단 외우기`,fn:()=>showDan(n),dan:n};
    if(!d.practiced)return{label:`${n}단 순서대로 연습`,fn:()=>startPractice(n),dan:n};
    return{label:`${n}단 시험`,fn:()=>startTest(n),dan:n};}}
  if(S.mix.stars===0)return{label:'구구단 종합 시험',fn:startMix,mix:true};
  for(const t of TRICKS)if(trickStars(t.id)===0)return{label:`암산 비법: ${t.name}`,fn:()=>showTrick(t.id),trick:t.id};
  return{label:'60초 스피드 챌린지',fn:startSpeed};
}
function weakFacts(){
  return Object.entries(S.facts).map(([k,v])=>({k,score:v.ng*2-v.ok})).filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score).slice(0,10).map(x=>x.k);
}

/* ---------- 소리 ---------- */
let AC=null;
function beep(ok){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    o.type='sine';o.frequency.value=ok?880:220;const t=AC.currentTime;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(ok?.15:.3));
    o.start(t);o.stop(t+.32);}catch(e){}
}

function showFlashcards(){
  let deck=[],seen=0,shown=false,cur=null;

    if(!deck.length)deck=shuffle(favPairs());cur=deck.shift();shown=false;draw();};
  const draw=()=>view(()=>`<div class="qhead"><button class="iconbtn" aria-label="닫기" data-cb="${cb(showFavs)}">✕</button>
      <div class="qtitle" style="flex:1;margin:0">즐겨찾기 카드 · ${seen}장 봤어요</div></div>
    <button class="card qbox flashcard" data-cb="${cb(()=>{shown=!shown;draw();})}">

      <div class="ansline" style="border-color:transparent">${shown?cur[0]*cur[1]:'<span class="muted" style="font-size:16px;font-weight:600">눌러서 답 보기</span>'}</div></button>
    <div class="row"><button class="btn ghost" data-cb="${cb(()=>{deck.splice(Math.min(2,deck.length),0,cur);seen++;next();})}">한 번 더 볼래요</button>

  runQuiz({title:'즐겨찾기 반복 연습',items,mode:'practice',onDone:r=>{
    showResult({title:'즐겨찾기 반복 연습',r,newStars:null,

  const draw=()=>{const ex=d.gen(lv);view(()=>`${topbar(true)}
    <div class="card"><h3>${d.name}</h3><div class="muted">${d.sub}</div>
      <div class="tip" style="margin-top:12px">💡 ${d.tip}</div>
      <div class="lvrow">
        <button class="iconbtn" aria-label="레벨 낮추기" data-cb="${cb(()=>{if(lv>1){lv--;draw();}})}">−</button>
        <div><b>Lv.${lv}</b><span class="muted"> / 10</span><div class="lvbar">${Array.from({length:10},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div></div>
        <button class="iconbtn" aria-label="레벨 올리기" data-cb="${cb(()=>{if(lv<st.max){lv++;draw();}else toast(lv>=10?'최고 레벨이에요':`Lv.${lv}에서 ${d.flash?'5문제 중 4개':'10문제 중 9개'} 이상 맞히면 열려요`);})}">+</button>
      </div>
      <div class="trick-ex">${d.about?d.about(lv):'예: '+ex.q}</div>
      <div class="muted" style="text-align:center">${d.flash?'5문제 중 4개':'10문제 중 9개'} 이상 맞히면 레벨 업 · 최고 기록 Lv.${st.max}</div></div>
    <button class="btn" data-cb="${cb(()=>startDrill(id,lv))}">Lv.${lv} 시작 (${d.flash?5:10}문제)</button>`);};
  draw();
}
function startDrill(id,lv){
  const d=DRILLS.find(x=>x.id===id),n=d.flash?5:10;
  const items=Array.from({length:n},()=>{const it=d.gen(lv);if(!it.hint&&d.hint)it.hint=d.hint;if(!it.hint)delete it.hint;return it;});
  runQuiz({title:`${d.name} Lv.${lv}`,items,mode:'test',onDone:r=>{
    const st=S.drills[id]||(S.drills[id]={lv:1,max:1});let nl=lv,msg;
    if(n-r.correct<=1){if(lv<10){nl=lv+1;msg=`🎉 레벨 업! Lv.${lv} → Lv.${nl}`;}else msg='최고 레벨 완벽! 진짜 숫자 천재예요';}
    else if(r.correct<=Math.floor(n/2)&&lv>1){nl=lv-1;msg=`Lv.${nl}에서 조금 더 다지고 올라가요`;}
    else msg=`${d.flash?'4개':'9개'} 이상 맞히면 레벨 업이에요`;
    st.lv=nl;st.max=Math.max(st.max,nl);save();
    showResult({title:`${d.name} Lv.${lv}`,r,newStars:null,msg,
      next:{label:`Lv.${nl} 계속하기`,fn:()=>startDrill(id,nl)},retry:()=>startDrill(id,lv)});}});
}
function playFlash(it){
  const myQ=Q;Q.locked=true;let i=0;
  const el=()=>document.getElementById('qtext');
  const step=()=>{if(Q!==myQ||!el())return;
    if(i<it.flash.length){const e=el();e.textContent=it.flash[i++];e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');
      setTimeout(()=>{if(Q!==myQ||!el())return;el().textContent=' ';setTimeout(step,130);},it.ms-130);}
    else{el().textContent='합은?';Q.locked=false;Q.qStart=performance.now();}};
  setTimeout(step,800);
}

/* ---------- 문제 풀기 엔진 ---------- */
let Q=null,timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function runQuiz(cfg){
  Q=Object.assign({queue:cfg.items?cfg.items.slice():[],answered:0,correct:0,wrong:0,times:[],mistakes:[],input:'',locked:false,showHint:false},cfg);
  if(Q.mode==='speed'){Q.queue=[Q.gen()];Q.endAt=Date.now()+Q.limit*1000;}
  drawQ();
  if(Q.mode==='speed'){timerId=setInterval(()=>{const el=document.getElementById('timer');const left=Math.max(0,Math.ceil((Q.endAt-Date.now())/1000));
    if(el)el.textContent=left+'초';const bar=document.getElementById('qbar');if(bar)bar.style.width=(left/Q.limit*100)+'%';
    if(left<=0){stopTimer();finishQ();}},200);}
}
function drawQ(){
  const it=Q.queue[0];Q.input='';Q.qStart=performance.now();Q.locked=false;
  const pct=Q.mode==='speed'?100:Q.answered/(Q.answered+Q.queue.length)*100;
  const keepTimer=timerId;timerId=null; // view() 가 타이머를 멈추지 않도록
  view(()=>`<div class="qhead"><button class="iconbtn" data-cb="${cb(()=>{stopTimer();Q=null;home();})}" aria-label="그만하기">✕</button>
      <div class="bar"><i id="qbar" style="width:${pct}%"></i></div>
      ${Q.mode==='speed'?`<span class="timer" id="timer">${Math.max(0,Math.ceil((Q.endAt-Date.now())/1000))}초</span>`:`<span class="timer">${Q.mode==='speed'?'':Q.answered+'/'+(Q.answered+Q.queue.length)}</span>`}</div>
    <div class="qtitle">${Q.title}${Q.mode==='speed'?` · 맞힌 개수 <b>${Q.correct}</b>`:''}</div>
    <div class="card qbox" id="qcard">
      <div class="q" id="qtext">${it.flash?'<span class="muted" style="font-size:22px">준비…</span>':it.q}</div>
      <div class="ansline" id="ans">&nbsp;</div>
      <div class="fb" id="fb">${it.hint?(it.retry||Q.showHint?`<span class="muted">💡 ${it.hint}</span>`:`<button class="hintbtn" data-cb="${cb(()=>{document.getElementById('fb').innerHTML=`<span class="muted">💡 ${it.hint}</span>`;})}">힌트 보기</button>`):''}</div>
    </div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-k="${k}">${k}</button>`).join('')}
      <button class="fn" data-k="C">지우기</button><button data-k="0">0</button><button class="fn" data-k="B">⌫</button></div>`);
  timerId=keepTimer;
  if(it.flash)playFlash(it);
}
function press(k){
  if(!Q||Q.locked)return;
  if(k==='C')Q.input='';else if(k==='B')Q.input=Q.input.slice(0,-1);
  else if(Q.input.length<5)Q.input+=k;
  const el=document.getElementById('ans');if(el)el.innerHTML=Q.input||'&nbsp;';
  const it=Q.queue[0];
  if(Q.input.length>=String(it.a).length&&/\d/.test(k))submit();
}
function submit(){
  const it=Q.queue[0],ok=Number(Q.input)===it.a,dt=(performance.now()-Q.qStart)/1000;
  Q.locked=true;Q.times.push(dt);
  if(it.key){const f=S.facts[it.key]||(S.facts[it.key]={ok:0,ng:0});ok?f.ok++:f.ng++;}
  S.total++;if(ok)S.correct++;touchDay();save();
  const fb=document.getElementById('fb'),card=document.getElementById('qcard');
  beep(ok);
  if(ok){
    if(!it.retry)Q.correct++;
    fb.className='fb good';fb.textContent=['정답!','좋아요!','맞았어요!','천재!'][rand(0,3)];card.classList.add('flash-good');
    setTimeout(advance,Q.mode==='speed'?250:450);
  }else{
    Q.wrong++;if(!Q.mistakes.some(m=>m.q===it.q))Q.mistakes.push(it);
    if(Q.mode==='practice')Q.queue.push(Object.assign({},it,{retry:true}));
    const canFav=it.x&&Q.mode!=='speed';
    fb.className='fb bad';fb.innerHTML=`아쉬워요. 정답은 <b>${it.q} = ${it.a}</b>`+(canFav?(favHas(it.x,it.y)?'<br><span class="muted">★ 즐겨찾기에 있어요</span>':
      `<br><button class="hintbtn" data-cb="${cb(b=>{if(!favHas(it.x,it.y))favToggle(it.x,it.y,true);b.textContent='★ 즐겨찾기에 넣었어요';b.disabled=true;})}">☆ 즐겨찾기에 넣기</button>`):'');
    card.classList.add('flash-bad');
    setTimeout(advance,Q.mode==='speed'?900:(canFav?2300:1700));
  }
}
function advance(){
  if(!Q)return;
  Q.answered++;Q.queue.shift();
  if(Q.mode==='speed'){if(Date.now()>=Q.endAt){finishQ();return;}Q.queue.push(Q.gen());}
  if(Q.queue.length===0){finishQ();return;}
  drawQ();
}
function finishQ(){
  stopTimer();const q=Q;Q=null;
  const avg=q.times.length?q.times.reduce((a,b)=>a+b,0)/q.times.length:0;
  q.onDone({correct:q.correct,total:q.items?q.items.length:q.answered,avg,mistakes:q.mistakes,wrong:q.wrong});
}

/* ---------- 문제 만들기 ---------- */
const factItem=(a,b)=>({q:`${a} × ${b}`,a:a*b,key:fkey(a,b),x:a,y:b});
function startPractice(n){
  S.dans[n].learned=true;save();
  const items=Array.from({length:9},(_,i)=>{const b=i+1;return Object.assign(factItem(n,b),{hint:b===1?`어떤 수에 1을 곱하면 그대로예요`:`앞의 답 ${n*(b-1)} 에 ${n}을 더하면 돼요`});});
  runQuiz({title:`${n}단 순서대로 연습`,items,mode:'practice',onDone:r=>{
    S.dans[n].practiced=true;save();
    showResult({title:`${n}단 순서 연습 끝!`,r,newStars:null,
      msg:r.wrong?`틀린 문제는 다시 풀어서 모두 맞혔어요.`:'한 번도 안 틀렸어요!',
      next:{label:`③ ${n}단 시험 보기`,fn:()=>startTest(n)},retry:()=>startPractice(n)});}});
}
function startTest(n){
  const items=shuffle(Array.from({length:9},(_,i)=>factItem(n,i+1)));
  runQuiz({title:`${n}단 시험 · 8개 이상 맞히면 통과`,items,mode:'test',onDone:r=>{
    const st=r.correct>=8?1+(r.correct===9?1:0)+(r.correct===9&&r.avg<=3?1:0):0;
    const d=S.dans[n],prev=d.stars;d.stars=Math.max(d.stars,st);d.best=d.best?Math.min(d.best,r.avg):r.avg;save();
    const nn=n+1;
    showResult({title:`${n}단 시험`,r,newStars:st,prev,
      msg:st?(st<3?(r.correct<9?'통과! 9개 모두 맞히면 별 2개':'평균 3초 안에 풀면 별 3개!'):'완벽해요!'):'아쉬워요. 다시 외워보고 도전해요',
      next:st?(nn<=9?{label:`${nn}단으로 가기`,fn:()=>showDan(nn)}:{label:'2단계: 종합 시험',fn:startMix}):{label:`${n}단 다시 외우기`,fn:()=>showDan(n)},
      retry:()=>startTest(n)});}});
}
function startMix(){
  const all=[];for(let a=2;a<=9;a++)for(let b=2;b<=9;b++)all.push([a,b]);
  const items=shuffle(all).slice(0,20).map(([a,b])=>factItem(a,b));
  runQuiz({title:'구구단 종합 시험 · 17개 이상 통과',items,mode:'test',onDone:r=>{
    const st=r.correct>=17?1+(r.correct>=19?1:0)+(r.correct===20&&r.avg<=2.5?1:0):0;
    const prev=S.mix.stars;S.mix.stars=Math.max(prev,st);S.mix.best=S.mix.best?Math.min(S.mix.best,r.avg):r.avg;save();
    showResult({title:'구구단 종합 시험',r,newStars:st,prev,
      msg:st?'구구단 졸업! 이제 암산 비법이 열렸어요':'틀린 문제는 약점 복습에 모아 뒀어요',
      next:st?{label:'3단계: 첫 번째 비법',fn:()=>showTrick(TRICKS[0].id)}:{label:'약점 복습',fn:startWeak},retry:startMix});}});
}
function startSpeed(){
  runQuiz({title:'60초 스피드',mode:'speed',limit:60,gen:()=>factItem(rand(2,9),rand(2,9)),onDone:r=>{
    const prev=S.speed.best,rec=r.correct>prev;if(rec)S.speed.best=r.correct;save();
    showResult({title:'60초 스피드 챌린지',r,newStars:null,speed:true,
      msg:rec?`🎉 새 기록! (이전 ${prev}개)`:`최고 기록 ${S.speed.best}개 · 조금만 더!`,
      next:{label:'홈으로',fn:home},retry:startSpeed});}});
}
function startWeak(){
  const keys=weakFacts();if(!keys.length){home();return;}
  const items=shuffle(keys.map(k=>{const[a,b]=k.split('x').map(Number);return Math.random()<.5?factItem(a,b):factItem(b,a);}));
  runQuiz({title:'약점 복습',items,mode:'practice',onDone:r=>{
    showResult({title:'약점 복습 끝!',r,newStars:null,msg:weakFacts().length?'맞힐수록 약점 목록에서 빠져요':'약점을 모두 없앴어요!',
      next:{label:'홈으로',fn:home},retry:startWeak});}});
}
function startTrick(id){
  const t=TRICKS.find(x=>x.id===id);
  const items=Array.from({length:10},()=>Object.assign(t.gen(),{hint:t.hint}));
  runQuiz({title:`${t.name} · 8개 이상 통과`,items,mode:'test',onDone:r=>{
    const st=r.correct>=8?1+(r.correct===10?1:0)+(r.correct===10&&r.avg<=6?1:0):0;
    const prev=trickStars(id);S.tricks[id]={stars:Math.max(prev,st)};save();
    const i=TRICKS.indexOf(t),nt=TRICKS[i+1];
    showResult({title:t.name,r,newStars:st,prev,
      msg:st?(nt?'다음 비법이 열렸어요':'모든 비법 완료! 당신은 숫자 천재 🏆'):'비법 설명을 다시 보고 도전해요',
      next:st?(nt?{label:`다음: ${nt.name}`,fn:()=>showTrick(nt.id)}:{label:'60초 스피드 챌린지',fn:startSpeed}):{label:'비법 다시 보기',fn:()=>showTrick(id)},
      retry:()=>startTrick(id)});}});
}

/* ---------- 결과 ---------- */
function showResult(o){
  const r=o.r;
  view(()=>`${topbar(true)}
    <div class="card" style="text-align:center">
      <h3>${o.title}</h3>
      ${o.newStars!==null&&o.newStars!==undefined?`<div class="big-stars">${stars(o.newStars)}</div>`:''}
      <div class="score">${o.speed?r.correct+'개':r.correct+' / '+r.total}</div>
      <div class="muted">${o.speed?`틀림 ${r.wrong}개`:`평균 ${r.avg.toFixed(1)}초`}${o.prev!==undefined&&o.newStars>o.prev?' · 별 기록 갱신!':''}</div>
      <p style="font-weight:700;margin:12px 0 0">${o.msg}</p>
      ${r.mistakes.length?`<div style="text-align:left;margin-top:14px"><div class="muted">틀린 문제</div><div class="mist">${r.mistakes.map(m=>m.x?`<button class="${favHas(m.x,m.y)?'on':''}" data-cb="${cb(b=>{favToggle(m.x,m.y);const on=favHas(m.x,m.y);b.classList.toggle('on',on);b.textContent=`${m.q} = ${m.a} ${on?'★':'☆'}`;})}">${m.q} = ${m.a} ${favHas(m.x,m.y)?'★':'☆'}</button>`:`<span>${m.q} = ${m.a}</span>`).join('')}</div>
      ${r.mistakes.some(m=>m.x)?`<div class="muted" style="margin-top:6px">눌러서 즐겨찾기에 넣거나 빼요</div><button class="btn ghost small" style="margin-top:8px" data-cb="${cb(b=>{let c=0;r.mistakes.forEach(m=>{if(m.x&&!favHas(m.x,m.y)){favToggle(m.x,m.y,true);c++;}});toast(c?`★ ${c}개를 즐겨찾기에 넣었어요`:'이미 모두 들어 있어요');document.querySelectorAll('.mist button').forEach(x=>{x.classList.add('on');x.textContent=x.textContent.replace('☆','★');});})}">틀린 문제 모두 즐겨찾기</button>`:''}</div>`:''}
    </div>
    <button class="btn" data-cb="${cb(o.next.fn)}">${o.next.label}</button>
    <div class="row" style="margin-top:8px"><button class="btn ghost small" data-cb="${cb(o.retry)}">다시 하기</button><button class="btn line small" data-cb="${cb(home)}">홈으로</button></div>
    <div class="saved">✓ 진도가 저장됐어요</div>`);
}

/* ---------- 백업 ---------- */
function showBackup(){
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  view(()=>`${topbar(true)}
    <div class="card"><h3>진도 저장 안내</h3>
      <p class="muted" style="margin:0">진도는 이 휴대폰(이 브라우저)에 자동으로 저장돼요. 휴대폰을 바꾸거나 다른 기기로 옮길 때만 아래 코드를 쓰세요.</p></div>
    <div class="card"><h3>내보내기</h3><textarea id="exp" readonly>${code}</textarea>
      <button class="btn small" style="margin-top:8px" data-cb="${cb(()=>{const t=document.getElementById('exp');t.select();
        (navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast('복사했어요'),()=>{document.execCommand('copy');toast('복사했어요');});})}">코드 복사</button></div>
    <div class="card"><h3>불러오기</h3><textarea id="imp" placeholder="다른 기기에서 복사한 코드를 붙여넣으세요"></textarea>
      <button class="btn small ghost" style="margin-top:8px" data-cb="${cb(()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('imp').value.trim()))));
        if(!o||!o.dans)throw 0;S=merge(defState(),o);save();toast('불러왔어요');home();}catch(e){toast('코드가 올바르지 않아요');}})}">불러오기</button></div>
    <button class="btn line small" style="color:var(--bad)" data-cb="${cb(b=>{if(b.dataset.sure){S=defState();save();toast('진도를 초기화했어요');home();}else{b.dataset.sure='1';b.textContent='한 번 더 누르면 모든 진도가 지워져요 (되돌릴 수 없음)';}})}">진도 초기화</button>`);
}

/* 키보드 입력 */
document.addEventListener('keydown',e=>{
  if(!Q)return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Backspace')press('B');
  else if(e.key==='Escape'){stopTimer();Q=null;home();}
});
home();
cloudInit();
</script>
